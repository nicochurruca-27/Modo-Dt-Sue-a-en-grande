<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modo DT: Sueño en Grande</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="mobile-tabs">
    <button data-view="table">Tabla</button>
    <button data-view="app" class="active">Partido</button>
    <button data-view="squad">Plantel</button>
    <button data-view="market">Mercado</button>
    <button data-view="youth">Inferiores</button>
  </nav>
  <div class="layout" data-view="app">
    <aside id="table-panel" class="side-panel"></aside>
    <!-- #app y #market-panel van juntos en la columna del medio: así en la
         PC el mercado cae justo abajo de #app (que termina en el bloque de
         noticias) sin necesidad de duplicar el HTML, y en el celular cada
         uno es su propia pestaña. -->
    <div class="center-col">
      <main id="app"></main>
      <section id="market-panel"></section>
    </div>
    <!-- La columna de la derecha: arriba el plantel y abajo las inferiores.
         Van juntas por la misma razón por la que #app y el mercado comparten
         la del medio: en la PC las inferiores caen justo abajo del plantel
         sin pedirle una cuarta columna a un layout que ya usa todo el ancho,
         y en el celular cada una es su propia pestaña. -->
    <div class="right-col">
      <aside id="squad-panel" class="side-panel"></aside>
      <section id="youth-panel"></section>
    </div>
  </div>
  <script defer src="js/data.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/internacional.js"></script>
  <script defer src="js/noticias.js"></script>
  <script defer src="js/finanzas.js"></script>
  <script defer src="js/economia.js"></script>
  <script defer src="js/mercado.js"></script>
  <script defer src="js/escudos.js"></script>
  <script defer src="js/colores.js"></script>
  <script defer src="js/marcas.js"></script>
  <script defer src="js/players.js"></script>
  <script defer src="js/juveniles.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/ui.js"></script>
</body>
</html>
